# 3-phase fine-tuning template for VieNeu-TTS (single-model scope)

project:
  name: vieneu_tts_finetune
  task_scope: single_model_only

paths:
  pretrained_model_dir: models/pretrained/VieNeu-TTS
  data_root: data/xtts
  train_csv: train_wav.csv
  eval_csv: eval.csv
  test_csv: test_wav.csv
  output_root: runs/vieneu_tts
  fixed_sentences_file: models/VieNeu-TTS/resource/templates/fixed_sentences.txt

audio_alignment:
  expected_sample_rate: 24000
  expected_channels: 1
  trim_silence: true
  vad:
    enabled: true
    frame_ms: 30
    energy_threshold_db: -40
  loudness_norm:
    enabled: true
    target_dbfs: -23.0
  min_audio_sec: 0.5
  max_audio_sec: 15.0

text_alignment:
  normalize_numbers: true
  normalize_abbreviations: true
  remove_extra_spaces: true
  keep_punctuation: true
  max_text_chars: 350

reproducibility:
  seed: 20260419
  deterministic_torch: true
  save_env_manifest: true
  env_manifest_file: env_manifest.txt

runtime:
  device: cuda
  precision: fp16
  gradient_accumulation_steps: 4
  dataloader_num_workers: 6
  dataloader_pin_memory: true
  gradient_clip_norm: 1.0

checkpointing:
  save_top_k: 3
  monitor: val_loss
  mode: min
  save_last: true
  save_optimizer_state: true
  every_n_steps: 500
  keep_audio_samples_per_epoch: true

validation:
  early_stopping_patience: 5
  fixed_test_sentences_count: 5
  run_eval_every_n_steps: 500

phases:
  phase1:
    name: warmup
    enabled: true
    epochs: 3
    learning_rate: 1.0e-5
    scheduler: cosine
    warmup_steps: 200
    freeze_modules:
      - dvae
      - vocoder
    unfreeze_modules:
      - gpt
      - decoder
    resume_from_checkpoint: ""

  phase2:
    name: full_finetune
    enabled: true
    epochs: 8
    learning_rate: 5.0e-6
    scheduler: cosine
    warmup_steps: 200
    freeze_modules: []
    unfreeze_modules:
      - gpt
      - decoder
      - text_encoder
    resume_from_checkpoint: "<BEST_PHASE1_CKPT>"

  phase3:
    name: refine
    enabled: true
    epochs: 4
    learning_rate: 1.0e-6
    scheduler: cosine
    warmup_steps: 0
    freeze_modules: []
    unfreeze_modules:
      - gpt
      - decoder
      - text_encoder
    resume_from_checkpoint: "<BEST_PHASE2_CKPT>"

smoke_test:
  enabled: true
  train_subset_size: 64
  eval_subset_size: 16
  max_steps: 100
  max_epoch: 1
  expected_quick_checks:
    - "train and val loss are logged"
    - "checkpoint and optimizer state are saved"
    - "at least one sample audio is generated"
